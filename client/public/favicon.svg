<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="gitinsight-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background rounded pill -->
  <rect width="32" height="32" rx="8" fill="#090d16" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="url(#gitinsight-grad)" fill-opacity="0.15" stroke="url(#gitinsight-grad)" stroke-width="1.2" />

  <!-- Git Branch / Intelligence Node Icon -->
  <circle cx="10" cy="9" r="2.5" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="10" cy="23" r="2.5" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="22" cy="16" r="2.5" fill="#c084fc" stroke="#ffffff" stroke-width="1" />

  <!-- Connecting Git Trunk & Branch Paths -->
  <path d="M10 11.5v9" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M10 18c3 0 5-1.5 8-3.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M18 14.5l1.5 1.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Subtle AI Sparkle accent -->
  <circle cx="24" cy="8" r="1.2" fill="#38bdf8" />
  <circle cx="20" cy="6" r="0.8" fill="#38bdf8" />
</svg>